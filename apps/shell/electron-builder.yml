appId: com.karya.desktop
productName: Karya
artifactName: ${productName}-${version}-${arch}-${os}.${ext}
copyright: Copyright © 2026 Karya

directories:
  app: build/app
  output: release
  buildResources: build

files:
  - "**/*"
  - "!**/.DS_Store"

extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*

electronDist: node_modules/electron/dist
npmRebuild: false
buildDependenciesFromSource: false
compression: normal
removePackageScripts: true
afterPack: scripts/clear-macos-signing-detritus.cjs

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dir
    - target: zip

win:
  icon: build/icon.ico
  publisherName: Karya
  target:
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icons
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish: null
