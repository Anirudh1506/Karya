name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native desktop dependencies
        run: pnpm --filter @karya/shell run rebuild:native

      - name: Decode App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Build, sign, and notarize
        timeout-minutes: 20
        run: pnpm run dist:mac
        env:
          DEBUG: electron-builder,electron-osx-sign*
          TURBO_TELEMETRY_DISABLED: 1
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and Gatekeeper acceptance
        run: |
          codesign --verify --deep --strict --verbose=2 apps/shell/release/mac-arm64/Karya.app
          codesign -dv --verbose=4 apps/shell/release/mac-arm64/Karya.app
          spctl --assess --type execute --verbose=4 apps/shell/release/mac-arm64/Karya.app

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/shell/release/*.zip
